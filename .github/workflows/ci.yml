name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The browser bundle is committed, so a stale one would ship silently.
      # Rebuild it and fail if it differs from what is checked in.
      - run: npm run vendor
      - name: public/vendor/libs.js is up to date
        run: git diff --exit-code -- public/vendor/libs.js
