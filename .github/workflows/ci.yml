name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The web app is built here and by prepack, never committed: dist/ is ignored.
      # Build first, as a user of the checkout would, before the suites run.
      - run: npm run typecheck
      - run: npm run build:frontend
      - run: npm run test:frontend
      - run: npm test
      # A29: pack a copy of the checkout, install it without devDependencies, start it and
      # check every asset. Opt-in, because packing builds the web app.
      - name: Packed release (A29)
        run: node --require ./test-setup.js --test package.test.js
        env:
          FLEET_PACKAGE_TEST: '1'
