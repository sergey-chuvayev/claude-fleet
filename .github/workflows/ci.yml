name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The web app is built here and by prepack, never committed: dist/ is ignored.
      # Build first so the server tests, and the package test (A29), run against it.
      - run: npm run typecheck
      - run: npm run build:frontend
      - run: npm run test:frontend
      - run: npm test
