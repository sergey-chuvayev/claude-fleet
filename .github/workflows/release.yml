name: Release

# Publishing is a tag push: `npm version patch && git push --follow-tags`.
# The tag must match the version in package.json, which is checked below.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance: it signs the published tarball with this run.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: The tag matches the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Tag $GITHUB_REF_NAME does not match package version $PKG"; exit 1; }
      # prepack rebuilds public/vendor/libs.js, so the tarball cannot ship a stale bundle.
      # --provenance lives here rather than in publishConfig: npm can only generate a
      # provenance statement from a recognised CI run, so setting it in package.json
      # makes `npm publish` from a workstation fail outright.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
